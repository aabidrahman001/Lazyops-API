# ===============================
# DEV CONFIGURATION
# ===============================
spring.application.name=lazyops

# Run backend on port 8081 so Angular (4200) can proxy calls
server.port=8081

# Database (Postgres local dev)
spring.datasource.url=jdbc:postgresql://localhost:5432/lazydb
spring.datasource.username=lazyadmin
spring.datasource.password=9999
spring.datasource.driver-class-name=org.postgresql.Driver

# Auto-create/update tables during development
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Connection Pool (HikariCP)
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000

# Logging (verbose in dev)
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql=TRACE

# CORS (allow Angular frontend)
spring.web.cors.allowed-origins=http://localhost:4200
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*

