# ===============================
# APPLICATION CONFIGURATION
# ===============================
spring.application.name=lazyops
#spring.main.banner-mode=off
banner.location=classpath:banner.txt

# ===============================
# SERVER CONFIGURATION
# ===============================
# Only needed for embedded Tomcat; remove if deploying to external Tomcat
#server.port=8081

# ===============================
# DATASOURCE CONFIGURATION (PostgreSQL)
# ===============================
spring.datasource.url=jdbc:postgresql://localhost:5432/lazydb
spring.datasource.username=lazyadmin
spring.datasource.password=9999
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Connection Pool (HikariCP)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000

# Logging
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql=TRACE

# ===============================
# CORS CONFIGURATION (Optional)
# ===============================
#spring.web.cors.allowed-origins=http://localhost:4200

